[package]
name = "mpv-web-demux"
version = "0.1.0"
edition = "2021"
description = "mpv-web demux WASM — EBML/Matroska, subs, chapitres. Types u64/i64 stricts."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
